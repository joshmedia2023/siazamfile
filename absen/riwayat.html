<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/app.css"><title>Riwayat</title></head><body><header>Riwayat <button onclick="history.back()">Kembali</button></header><main><div class="card"><input id="month" type="month"><button id="load">Tampilkan</button><div id="list"></div></div></main><script type="module">import{getAttendance}from'./js/api.js';load.onclick=async()=>{list.innerHTML=(await getAttendance(month.value)).map(x=>`<div class=row>${x.tanggal||''} | Masuk ${x.masuk||'-'} | Pulang ${x.pulang||'-'}</div>`).join('')||'Tidak ada data'};</script></body></html>
