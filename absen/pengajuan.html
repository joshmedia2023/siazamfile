<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/app.css"><title>Pengajuan</title></head><body><header>Pengajuan <button onclick="history.back()">Kembali</button></header><main><div class="card"><select id="type"><option>CUTI</option><option>IZIN</option><option>PERJALANAN DINAS</option></select><input id="start" type="date"><input id="end" type="date"><textarea id="reason" placeholder="Keterangan"></textarea><button id="submit">Kirim Pengajuan</button><p id="msg"></p></div></main><script type="module">import{submitRequest}from'./js/api.js';submit.onclick=async()=>msg.textContent=await submitRequest({type:type.value,start:start.value,end:end.value,reason:reason.value});</script></body></html>
